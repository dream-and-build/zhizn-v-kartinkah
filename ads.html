<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Реклама на баннере — Жизнь в картинках</title>
<meta name="description" content="Небольшой придорожный щит в левом нижнем углу картины дня. Как занять его и как обсудить стоимость.">
<script src="i18n.js"></script>
<script src="social.js"></script>
<script src="count.js" defer></script>
<script src="ads-text.js"></script>
<style>
  :root { --bg: #0f0c0a; --panel: #1a1512; --line: #33291f; --fg: #f1e8dc; --muted: #a8998a; --accent: #e9a75a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  /* Та же панель, что на странице события: «К картине» и выбор языка всегда на экране */
  .bar { position: sticky; top: 0; z-index: 10; background: #0f0c0ae6; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 600;
          padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  [dir="rtl"] .back .arrow { transform: scaleX(-1); }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; }
  h1 { font: 600 clamp(24px, 4.5vw, 34px)/1.25 Georgia, "Times New Roman", serif; margin: 0 0 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 34px 0 10px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 15px; }
  ul { padding-inline-start: 22px; margin: 0 0 14px; }
  li { margin: 0 0 8px; }
  .board { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 16px 18px; margin: 20px 0; }
  .board p:last-child { margin: 0; }
  form { display: grid; gap: 12px; margin-top: 14px; }
  label { display: grid; gap: 5px; font-size: 14px; color: var(--muted); }
  input, textarea { font: inherit; font-size: 16px; color: var(--fg); background: #0b0806; border: 1px solid var(--line);
                    border-radius: 9px; padding: 10px 12px; width: 100%; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; font-weight: 600; cursor: pointer; background: var(--accent); color: #1b1206; border: 0;
           border-radius: 999px; padding: 11px 22px; justify-self: start; }
  button[disabled] { opacity: .6; cursor: default; }
  .said { font-size: 15px; color: var(--muted); min-height: 1.4em; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="back" id="back" href="index.html"><span class="arrow">←</span> <span id="back-text"></span></a>
  <div class="tools" id="tools"></div>
</div></div>
<main id="page"></main>

<script>
const INBOX = 'https://script.google.com/macros/s/AKfycbyhyR7J4X7loYL20pxz4a8PN0bl3oMDYrI6XzD7Z521usFOvbn5roPldfjIruqzj0uI8w/exec';
const TG = 'https://t.me/zhizn_v_kartinkah_world';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const page = document.getElementById('page'), back = document.getElementById('back');

const social = socialButtons(() => ({ url: location.href, title: document.title }));
document.getElementById('tools').append(social, langPicker(() => { social.repaint(); render(); }));
render();

function render() {
  const a = ADS_TEXT[LANG] || ADS_TEXT.en || ADS_TEXT.ru;
  back.href = `index.html?lang=${LANG}`;
  document.getElementById('back-text').textContent = t('back');
  document.title = a.title + ' — Worldview Daily';

  page.innerHTML = `
    <h1>${esc(a.title)}</h1>
    <p>${esc(a.lead)}</p>

    <div class="board">
      <p><b>${esc(a.board_title)}</b></p>
      <p>${esc(a.board_text)}</p>
      <p class="muted">${esc(a.board_note)}</p>
    </div>

    <h2>${esc(a.where_title)}</h2>
    <ul><li>${esc(a.where_1)}</li><li>${esc(a.where_2)}</li><li>${esc(a.where_3)}</li></ul>
    <p class="muted">${esc(a.where_note)}</p>

    <h2>${esc(a.what_title)}</h2>
    <ul><li>${esc(a.what_1)}</li><li>${esc(a.what_2)}</li><li>${esc(a.what_3)}</li></ul>
    <p>${esc(a.price)}</p>

    <h2>${esc(a.coop_title)}</h2>
    <p>${esc(a.coop)}</p>

    <h2>${esc(a.form_title)}</h2>
    <p>${esc(a.form_lead)}</p>
    <form id="ask">
      <label>${esc(a.f_who)}<input name="who" autocomplete="organization" placeholder="${esc(a.f_who_hint)}"></label>
      <label>${esc(a.f_link)}<input name="link" inputmode="url" placeholder="${esc(a.f_link_hint)}"></label>
      <label>${esc(a.f_when)}<input name="when" placeholder="${esc(a.f_when_hint)}"></label>
      <label>${esc(a.f_text)}<textarea name="text" placeholder="${esc(a.f_text_hint)}"></textarea></label>
      <button type="submit">${esc(a.send)}</button>
      <p class="said" id="said"></p>
    </form>
    <p class="muted">${esc(a.direct)} <a href="${TG}">t.me/zhizn_v_kartinkah_world</a></p>
    ${supportCard()}
  `;
  document.getElementById('ask').addEventListener('submit', e => send(e, a));
}

// Заявка уходит в приёмник проекта: оттуда она попадает в таблицу и письмом автору
async function send(e, a) {
  e.preventDefault();
  const form = e.target, said = document.getElementById('said'), button = form.querySelector('button');
  const v = name => (form.elements[name].value || '').trim();
  if (!v('who') && !v('link') && !v('text')) {
    said.textContent = a.empty;
    return;
  }
  button.disabled = true;
  said.textContent = a.sending;
  const body = new URLSearchParams({
    who: v('who'), link: v('link'), when: v('when'), text: v('text'),
    page: location.href, lang: LANG,
  });
  try {
    await fetch(INBOX, { method: 'POST', mode: 'no-cors', body });
    form.reset();
    said.textContent = a.sent;
  } catch (err) {
    said.textContent = a.failed + ' t.me/zhizn_v_kartinkah_world';
  }
  button.disabled = false;
}
</script>
</body>
</html>
