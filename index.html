<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жизнь в картинках</title>
<meta name="description" content="Каждый день — одна картина всего мира. Чем больше о событии говорят, тем крупнее его рисунок.">
<meta property="og:title" content="Жизнь в картинках">
<meta property="og:description" content="Каждый день — одна картина всего мира. Чем больше о событии говорят, тем крупнее его рисунок.">
<style>
  :root { --bg: #0b0908; --accent: #e9a75a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #f1e8dc; font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: sticky; top: 0; height: 100vh; height: 100dvh; display: grid; place-items: center; padding: 12px; }
  /* --ar — высота к ширине текущей картины: 1 у квадратных, 16/9 у вертикальных */
  #frame { --ar: 1; position: relative; width: min(100%, calc((100dvh - 24px) / var(--ar))); aspect-ratio: 1 / var(--ar); transition: width .3s; }
  #frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: 8px; opacity: 0; user-select: none; -webkit-user-drag: none; }
  /* На телефоне вертикальная картина — на весь экран */
  @media (max-width: 560px) { #stage { padding: 0; } #frame { width: min(100%, calc(100dvh / var(--ar))); } #frame img { border-radius: 0; } }
  #frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #frame circle { fill: transparent; stroke: transparent; stroke-width: .005; cursor: pointer; transition: stroke .15s, fill .15s; }
  #frame circle.hover { stroke: #fffc; fill: #ffffff14; }
  #date { position: absolute; left: 14px; bottom: 12px; font: 600 15px/1 Georgia, "Times New Roman", serif; letter-spacing: .02em;
          padding: 7px 11px; border-radius: 999px; background: #000000a0; pointer-events: none; }
  /* Дни, что остались человечеству на Земле: без подписи, почти сливается с картиной */
  #left { position: absolute; right: 14px; bottom: 16px; direction: ltr; font: 13px/1 Georgia, "Times New Roman", serif; font-variant-numeric: tabular-nums;
          letter-spacing: .06em; color: #fff; opacity: .32; pointer-events: none; user-select: none; }
  .step { height: 100vh; height: 100dvh; }
  #langbox { position: fixed; top: 12px; inset-inline-end: 12px; z-index: 20; display: flex; gap: 8px; align-items: center; }
</style>
<script src="i18n.js"></script>
<script src="social.js"></script>
</head>
<body>
<div id="track">
  <div id="stage">
    <div id="frame">
      <svg viewBox="0 0 1 1" preserveAspectRatio="none" role="img" aria-label="Картина мира"></svg>
      <div id="date"></div>
      <div id="left" aria-hidden="true"></div>
    </div>
  </div>
  <div id="steps"></div>
</div>
<div id="langbox"></div>
<script>
const frame = document.getElementById('frame'), svg = frame.querySelector('svg'), dateEl = document.getElementById('date');
const leftEl = document.getElementById('left');
let days = [], current = -1;

// 600 млн лет в днях на дату первой картины; каждый следующий день — на один меньше
const DAYS_LEFT = 219150000000, FIRST_DAY = Date.UTC(2026, 10, 1);
function daysLeft(date) {
  const [y, m, d] = date.split('-').map(Number);
  return String(DAYS_LEFT - Math.round((Date.UTC(y, m - 1, d) - FIRST_DAY) / 864e5)).replace(/\B(?=(\d{3})+$)/g, ' ');
}

fetch('days.json').then(r => r.json()).then(init);

// Дата в углу; если за день несколько картин — с временем суток
function labels() {
  const perDate = {};
  days.forEach(d => perDate[d.date] = (perDate[d.date] || 0) + 1);
  days.forEach(d => {
    d.label = formatDate(d.date) + (perDate[d.date] > 1 ? ', ' + t('parts')[d.key.split('-').pop() - 1] : '');
    if (d.img) d.img.alt = t('alt') + ', ' + d.label;
  });
}

function init(data) {
  days = data;
  const social = socialButtons(() => ({ url: location.href, title: 'Жизнь в картинках — ' + days[current].label, image: days[current].image }));
  document.getElementById('langbox').append(social, langPicker(() => { social.repaint(); labels(); current = -1; onScroll(); }));
  days.forEach((d, i) => {
    const img = new Image();
    img.src = d.image; img.loading = i < 2 ? 'eager' : 'lazy';
    frame.insertBefore(img, svg);
    d.img = img;
    // Каждому дню, кроме последнего, — экран прокрутки до следующего
    if (i > 0) document.getElementById('steps').insertAdjacentHTML('beforeend', '<div class="step"></div>');
  });
  labels();
  // Возврат со страницы события — на тот же день
  const back = days.findIndex(d => d.key === location.hash.slice(1));
  if (back > 0) scrollTo(0, back * innerHeight);
  onScroll();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
}

function onScroll() {
  const pos = Math.min(Math.max(scrollY / (innerHeight || 1), 0), days.length - 1) || 0;
  const i = Math.floor(pos), f = pos - i;
  // Плавное перетекание: следующий (более ранний) день проступает сквозь текущий
  days.forEach((d, k) => d.img.style.opacity = k === i ? 1 : k === i + 1 ? Math.max(0, Math.min(1, (f - .25) / .5)) : 0);
  const active = f > .5 && i + 1 < days.length ? i + 1 : i;
  if (active === current) return;
  current = active;
  const d = days[current], ar = d.aspect || 1;
  frame.style.setProperty('--ar', ar);
  svg.setAttribute('viewBox', `0 0 1 ${ar}`);
  dateEl.textContent = d.label;
  leftEl.textContent = daysLeft(d.date);
  history.replaceState(null, '', `?lang=${LANG}#${d.key}`);
  // Мелкие сюжеты поверх крупных, чтобы их можно было выбрать
  svg.innerHTML = d.spots.slice().sort((a, b) => b.r - a.r).map(s =>
    `<a href="event.html?d=${d.key}&e=${encodeURIComponent(s.id)}&lang=${LANG}"><circle data-id="${s.id}" cx="${s.x}" cy="${s.y * ar}" r="${s.r * .8}"></circle></a>`).join('');
}

// Подсвечиваем самый маленький сюжет под курсором
svg.addEventListener('mousemove', e => {
  const box = svg.getBoundingClientRect(), ar = days[current].aspect || 1;
  const x = (e.clientX - box.left) / box.width, y = (e.clientY - box.top) / box.height;
  const hit = days[current].spots.filter(s => Math.hypot(s.x - x, (s.y - y) * ar) <= s.r * .8).sort((a, b) => a.r - b.r)[0];
  svg.querySelectorAll('circle').forEach(c => c.classList.toggle('hover', !!hit && c.dataset.id === hit.id));
});
svg.addEventListener('mouseleave', () => svg.querySelectorAll('circle').forEach(c => c.classList.remove('hover')));
</script>
</body>
</html>
