<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жизнь в картинках</title>
<meta name="description" content="Каждый день — одна картина всего мира. Чем больше о событии говорят, тем крупнее его рисунок.">
<meta property="og:title" content="Жизнь в картинках">
<meta property="og:description" content="Каждый день — одна картина всего мира. Чем больше о событии говорят, тем крупнее его рисунок.">
<style>
  :root {
    --bg: #0f0c0a; --panel: #1a1512; --line: #33291f; --fg: #f1e8dc; --muted: #a8998a;
    --accent: #e9a75a; --accent-2: #7cc4e8; --head: 52px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  header {
    position: fixed; inset: 0 0 auto 0; height: var(--head); z-index: 20; display: flex; align-items: center;
    justify-content: space-between; padding: 0 16px; background: linear-gradient(var(--bg) 60%, transparent);
  }
  .logo { font: 600 19px/1 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
  .logo small { display: block; font: 12px/1.4 system-ui, sans-serif; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
  .tg { text-decoration: none; font-weight: 600; font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }

  #track { position: relative; }
  #stage {
    position: sticky; top: 0; height: 100vh; height: 100dvh; padding: calc(var(--head) + 4px) 16px 16px;
    display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: center;
    max-width: 1420px; margin: 0 auto; padding-right: 110px; /* справа — лента дат */
  }
  #frame { position: relative; width: min(100%, calc(100dvh - var(--head) - 24px)); aspect-ratio: 1; margin: 0 auto; }
  #frame img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; opacity: 0; transition: opacity .12s linear; user-select: none; -webkit-user-drag: none; }
  #frame svg { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; border-radius: 10px; }
  #frame circle { fill: transparent; stroke: transparent; stroke-width: .004; transition: stroke .15s; }
  #frame circle.hover { stroke: #fff6; }
  #frame circle.on { stroke: var(--accent); stroke-width: .006; fill: #e9a75a14; }
  .hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: #000a; color: #fff; font-size: 13px; padding: 6px 12px; border-radius: 999px; pointer-events: none; transition: opacity .4s; white-space: nowrap; }

  #panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; max-height: calc(100dvh - var(--head) - 32px); overflow: auto; }
  #panel h2 { font: 600 22px/1.25 Georgia, serif; margin: 0 0 4px; }
  #panel h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  #panel p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .top { list-style: none; padding: 0; margin: 0; }
  .top li { padding: 8px 10px; margin: 0 -10px; border-radius: 8px; cursor: pointer; }
  .top li:hover { background: #ffffff0d; }
  .bars div { display: grid; grid-template-columns: 130px 1fr 30px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
  .bars i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
  .bars span:first-child { color: var(--muted); }
  .src a { display: inline-block; margin: 0 8px 6px 0; font-size: 14px; }
  .back { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 999px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; margin-bottom: 12px; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #ffffff12; color: var(--muted); margin-bottom: 10px; }

  #timeline { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); z-index: 15; display: flex; flex-direction: column; gap: 4px; }
  #timeline button { all: unset; cursor: pointer; text-align: right; font-size: 12px; color: var(--muted); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  #timeline button.on { color: var(--bg); background: var(--accent); font-weight: 600; }
  .step { height: 100vh; height: 100dvh; }

  @media (max-width: 900px) {
    #stage { grid-template-columns: 1fr; align-content: start; gap: 12px; padding-top: calc(var(--head) + 4px); padding-right: 16px; }
    #frame { width: 100%; }
    #panel { max-height: none; padding: 14px; }
    #panel .full { display: none; }
    #panel.open { position: fixed; inset: auto 0 0 0; z-index: 30; max-height: 70dvh; border-radius: 16px 16px 0 0; box-shadow: 0 -10px 40px #000a; padding-bottom: 64px; }
    #panel.open .full { display: block; }
    #timeline { right: 4px; top: auto; bottom: 12px; transform: none; flex-direction: row-reverse; max-width: calc(100vw - 8px); overflow-x: auto; background: #000b; border-radius: 999px; padding: 4px; }
    .logo small { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Жизнь в картинках<small>Каждый день — одна картина всего мира</small></div>
  <a class="tg" href="https://t.me/zhizn_v_kartinkah_world" target="_blank" rel="noopener">Telegram</a>
</header>

<div id="track">
  <div id="stage">
    <div id="frame">
      <svg viewBox="0 0 1 1" preserveAspectRatio="none" aria-label="Картина дня"></svg>
      <div class="hint" id="hint">Нажмите на рисунок — узнаете, что произошло</div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
  <div id="steps"></div>
</div>
<nav id="timeline" aria-label="Дни"></nav>

<script>
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const human = d => { const [y, m, day] = d.split('-').map(Number); return `${day} ${MONTHS[m - 1]} ${y}`; };
const short = d => { const [, m, day] = d.split('-').map(Number); return `${day} ${MONTHS[m - 1].slice(0, 3)}`; };

const frame = document.getElementById('frame'), svg = frame.querySelector('svg');
const panel = document.getElementById('panel'), timeline = document.getElementById('timeline');
let days = [], current = -1, selected = null;

fetch('days.json').then(r => r.json()).then(init);

function init(data) {
  days = data;
  // Несколько срезов за один день подписываем временем суток
  const perDate = {};
  days.forEach(d => perDate[d.date] = (perDate[d.date] || 0) + 1);
  days.forEach(d => d.label = short(d.date) + (perDate[d.date] > 1 ? ' · ' + d.slot_name : ''));

  days.forEach((d, i) => {
    const img = new Image();
    img.src = d.image; img.alt = 'Картина мира, ' + human(d.date); img.loading = i < 2 ? 'eager' : 'lazy';
    frame.insertBefore(img, svg);
    d.img = img;
    // Каждому дню, кроме последнего, — экран прокрутки до следующего
    if (i > 0) document.getElementById('steps').insertAdjacentHTML('beforeend', '<div class="step"></div>');
    const b = document.createElement('button');
    b.textContent = d.label;
    b.onclick = () => scrollTo({ top: i * innerHeight, behavior: 'smooth' });
    timeline.appendChild(b);
  });
  onScroll();
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 5000);
}

function onScroll() {
  const pos = Math.min(Math.max(scrollY / (innerHeight || 1), 0), days.length - 1) || 0;
  const i = Math.floor(pos), f = pos - i;
  // Плавное перетекание: следующий (более ранний) день проступает сквозь текущий
  days.forEach((d, k) => d.img.style.opacity = k === i ? 1 : k === i + 1 ? Math.max(0, (f - .25) / .5) : 0);
  const active = f > .5 && i + 1 < days.length ? i + 1 : i;
  if (active !== current) { current = active; selected = null; drawSpots(); showDay(); }
}

function drawSpots() {
  const d = days[current];
  // Мелкие сверху, чтобы их можно было нажать поверх крупных
  svg.innerHTML = d.spots.slice().sort((a, b) => b.r - a.r).map(s =>
    `<circle data-id="${esc(s.id)}" cx="${s.x}" cy="${s.y}" r="${s.r * .8}"></circle>`).join('');
  timeline.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === current));
}

function spotAt(e) {
  const box = svg.getBoundingClientRect();
  const x = (e.clientX - box.left) / box.width, y = (e.clientY - box.top) / box.height;
  const hit = days[current].spots.filter(s => Math.hypot(s.x - x, s.y - y) <= s.r * .8);
  return hit.sort((a, b) => a.r - b.r)[0];
}

svg.addEventListener('mousemove', e => {
  const s = spotAt(e);
  svg.querySelectorAll('circle').forEach(c => c.classList.toggle('hover', !!s && c.dataset.id === s.id));
  svg.style.cursor = s ? 'pointer' : 'default';
});
svg.addEventListener('mouseleave', () => svg.querySelectorAll('circle').forEach(c => c.classList.remove('hover')));
svg.addEventListener('click', e => { const s = spotAt(e); if (s) showSpot(s.id); });

function highlight(id) {
  svg.querySelectorAll('circle').forEach(c => c.classList.toggle('on', c.dataset.id === id));
}

function showDay() {
  const d = days[current];
  highlight(null);
  panel.classList.remove('open');
  panel.innerHTML = `
    <h2>${human(d.date)}</h2>
    <p class="muted">${esc(d.mood)}</p>
    <div class="full">
      <h3>Главное</h3>
      <ul class="top">${d.top.map(t => {
        const s = d.spots.find(s => s.title === t);
        return `<li ${s ? `data-id="${esc(s.id)}"` : ''}>${esc(t)}</li>`;
      }).join('')}</ul>
      <h3>Как читать картину</h3>
      <p class="muted">Чем больше изданий пишет о событии, тем крупнее его рисунок. Чем быстрее растёт интерес, тем ближе он к центру. По краям — мелочи дня. Прокрутите вниз, чтобы увидеть прошлые дни.</p>
    </div>`;
  panel.querySelectorAll('li[data-id]').forEach(li => li.onclick = () => showSpot(li.dataset.id));
}

function showSpot(id) {
  const d = days[current], s = d.spots.find(s => s.id === id);
  if (!s) return;
  selected = id; highlight(id);
  const bar = (name, v) => v == null ? '' :
    `<div><span>${name}</span><i style="width:${v}%"></i><span>${v}</span></div>`;
  panel.innerHTML = `
    <button class="back">← ${esc(human(d.date))}</button>
    ${s.region ? `<span class="tag">${esc(s.region)}</span>` : ''}
    <h2>${esc(s.title)}</h2>
    ${s.kind === 'major' ? `
      <p class="muted">${s.domain_count ? `О событии написали ${s.domain_count} изданий из нашей выборки.` : ''}
      Размер рисунка — внимание к событию, место — скорость, с которой оно набирает обороты.</p>
      <div class="bars">${bar('Внимание', s.mentions)}${bar('Значимость', s.significance)}${bar('Скорость роста', s.velocity)}</div>`
      : `<p class="muted">Мелочь дня — живёт по краю картины.</p>`}
    <div class="full">
      ${s.sources.length ? `<h3>Источники</h3><div class="src">${s.sources.map(x =>
        `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join('')}</div>` : ''}
    </div>`;
  panel.classList.add('open');
  panel.querySelector('.back').onclick = showDay;
}
</script>
</body>
</html>
