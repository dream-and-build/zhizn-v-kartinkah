<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Жизнь в картинках</title>
<script src="i18n.js"></script>
<script src="social.js"></script>
<style>
  :root { --bg: #0f0c0a; --panel: #1a1512; --line: #33291f; --fg: #f1e8dc; --muted: #a8998a; --accent: #e9a75a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); }
  /* Панель с кнопкой «К картине» и выбором языка всегда на экране */
  .bar { position: sticky; top: 0; z-index: 10; background: #0f0c0ae6; backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .back { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 600;
          padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
  [dir="rtl"] .back .arrow { transform: scaleX(-1); }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 60px; }
  .meta { color: var(--muted); font-size: 14px; margin: 18px 0 6px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: #ffffff12; margin-inline-start: 6px; }
  h1 { font: 600 clamp(24px, 4.5vw, 34px)/1.25 Georgia, "Times New Roman", serif; margin: 0 0 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 30px 0 10px; }
  .fragment { width: 100%; max-width: 420px; aspect-ratio: 1; border-radius: 12px; background-color: #000; background-repeat: no-repeat; border: 1px solid var(--line); }
  .picture { display: grid; grid-template-columns: minmax(0, 260px) 1fr; gap: 18px; align-items: start; }
  .picture p { margin: 0; color: var(--muted); }
  .stat { color: var(--muted); font-size: 15px; }
  ol { padding-inline-start: 22px; margin: 0; }
  ol li { margin: 0 0 14px; }
  ol a { text-decoration: none; }
  ol a:hover { text-decoration: underline; }
  .src { display: block; color: var(--muted); font-size: 14px; }
  .missing { color: var(--muted); margin-top: 60px; text-align: center; }
  @media (max-width: 560px) { .picture { grid-template-columns: 1fr; } .fragment { max-width: none; } }
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <a class="back" id="back" href="index.html"><span class="arrow">←</span> <span id="back-text"></span></a>
  <div class="tools" id="tools"></div>
</div></div>
<main id="page"></main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q = new URLSearchParams(location.search), key = q.get('d'), id = q.get('e');
const page = document.getElementById('page'), back = document.getElementById('back');

let shown = null;  // событие на экране — его и отправляем в «Поделиться»
const social = socialButtons(() => ({ url: location.href, title: shown ? shown.title : document.title, image: shown && shown.image }));
document.getElementById('tools').append(social, langPicker(() => { social.repaint(); load(); }));
load();

function load() {
  back.href = `index.html?lang=${LANG}#${encodeURIComponent(key || '')}`;
  document.getElementById('back-text').textContent = t('back');
  // Нет перевода — показываем русский оригинал
  fetch(`day/${LANG}/${key}.json`).then(r => r.ok ? r : fetch(`day/ru/${key}.json`))
    .then(r => r.json()).then(render).catch(missing);
}

function missing() {
  page.innerHTML = `<p class="missing">${esc(t('missing'))}</p>`;
}

function render(day) {
  const e = day.events[id];
  if (!e) return missing();
  document.title = e.title + ' — Жизнь в картинках';
  shown = { title: e.title, image: day.image };
  // Фрагмент картины, где нарисовано событие: увеличиваем картинку так, чтобы круг сюжета заполнил квадрат
  const { x, y, r } = e.spot, zoom = 1 / (2 * r);
  const posX = (x - r) / (1 - 2 * r || 1) * 100, posY = (y - r) / (1 - 2 * r || 1) * 100;
  const fragment = `background-image:url('${esc(day.image)}');background-size:${zoom * 100}%;background-position:${posX}% ${posY}%`;

  page.innerHTML = `
    <div class="meta">${esc(formatDate(day.date))}${e.region ? `<span class="tag">${esc(e.region)}</span>` : ''}</div>
    <h1>${esc(e.title)}</h1>
    ${e.summary ? `<h2>${esc(t('happened'))}</h2><p>${esc(e.summary)}</p>` : ''}
    ${e.kind === 'major' && e.domain_count ? `<p class="stat">${esc(t('outlets', { n: e.domain_count }))}</p>` : ''}
    <h2>${esc(t('picture'))}</h2>
    <div class="picture">
      <a href="${back.getAttribute('href')}" aria-label="${esc(t('back'))}"><div class="fragment" style="${fragment}"></div></a>
      <p>${esc(e.picture || '')}</p>
    </div>
    ${e.articles.length ? `<h2>${esc(t('sources'))}</h2><ol>${e.articles.map(a => `
      <li><a href="${esc(a.url)}" target="_blank" rel="noopener" dir="auto">${esc(a.title || a.url)}</a>
      <span class="src">${esc(a.domain)}${a.published ? ' · ' + esc(formatDate(a.published, true)) : ''}</span></li>`).join('')}</ol>` : ''}
  ${supportCard()}
  `;
}
</script>
</body>
</html>
